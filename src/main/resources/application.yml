server:
  port: 8081

spring:
  application:
    name: identity-service

  datasource:
    url: jdbc:postgresql://localhost:5432/identity_db
    username: postgres
    password: hung123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

        jwt:
          # Chuỗi secret 256-bit (>= 32 ký tự). Nên đặt trong ENV khi production.
          secret: "mySuperSecretKeyForJwtIdentityService2024ChangeMeInProduction!!"
          # 3.600.000 ms = 1 giờ
          expiration: 3600000